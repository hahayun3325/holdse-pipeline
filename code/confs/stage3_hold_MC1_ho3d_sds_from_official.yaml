# ================================================================
# Stage 3: Optimized Config - 804b0572f Performance with 9fdbae668 Stability
# Combines aggressive SDS refinement (804b0572f) with protective measures (9fdbae668)
# ================================================================

# ================================================================
# PHASE 3: SDS GUIDANCE (Strong refinement, capped peak to prevent collapse)
# ================================================================
phase3:
  enabled: true

  # GHOP Checkpoints
  ghop:
    config_path: checkpoints/ghop/config.yaml
    device: cuda
    unet_checkpoint: /home/fredcui/Projects/ghop/output/joint_3dprior/mix_data/checkpoints/last.ckpt
    unified_checkpoint: /home/fredcui/Projects/ghop/output/joint_3dprior/mix_data/checkpoints/last.ckpt
    vqvae_checkpoint: /home/fredcui/Projects/ghop/output/joint_3dprior/mix_data/checkpoints/last.ckpt
    unet_use_pretrained: true
    vqvae_use_pretrained: true
    # Use Hugging Face CLIP instead of checkpoint CLIP
    use_huggingface_clip: true
    clip_model_name: "openai/clip-vit-large-patch14"  # Optional: default if not specified

  grid_resolution: 16            # was 32
  spatial_lim: 1.5

  # Phase 3 Boundaries - Earlier start for refinement (804b0572f style)
  phase3_start_iter: 3000        # was 1500 - wait until geometry is stable
  phase3_end_iter: 34999

  # SDS Configuration - Stronger guidance for refinement (804b0572f)
  sds:
    diffusion_steps: 1000
    guidance_scale: 3.0          # was 4.0
    max_step_ratio: 0.98
    min_step_ratio: 0.02
    noise_schedule: linear
    prediction_respacing: 50

  sds_iters: 1
  use_modular_init: true

  # Re-tuned SDS weight schedule
  w_sds_schedule:
    enabled: true
    step_3000: 0.05              # was 0.20
    step_4000: 0.15              # was 0.30
    step_8000: 0.30              # was 0.40
    step_15000: 0.40             # was 0.50
    step_20000: 0.50             # was 0.20
    step_25000: 0.50             # was 0.10
    step_30000: 0.40             # was 0.05
    step_34999: 0.20             #
    interpolation: "linear"

  diagnostics:
    rgb_convergence_check:
      enabled: false             # Disable to prevent interference
      step: 20000
      threshold: 0.08
      warning_only: true
    sds_trend_check:
      enabled: false             # Disable to prevent SDS suppression
      check_every: 1000
      window: 2000
      max_increase: 0.2
    log_sds_weight_every: 100

  warmup_iters: 0

# ================================================================
# PHASE 4: CONTACT REFINEMENT with Late Geometry Freeze
# ================================================================
phase4:
  enabled: true
  freeze_object_geometry: true    # Enable
  freeze_at_iter: 35000           # Match contact phase start
  freeze_chamfer_threshold: 0.02  #

  # Phase boundaries - 1/3 of training (19,800 steps)
  contact_start_iter: 35000      # ← CHANGED: Start earlier
  contact_end_iter: 59499       # End before Phase 5
  contact_warmup_iters: 1000     # ← CHANGED: Longer warmup

  # Thresholds
  contact_thresh: 0.20
  collision_thresh: 0.08

  # Contact weights
  w_contact: 0.5                 # ← changed from 1.5
  w_penetration: 50.0           # ← changed from 150
  w_attraction: 5.0             # ← changed from 15
  w_damping: 0.001               # ← ENABLED

  # Mesh extraction settings
  mesh_resolution: 16          # Marching cubes resolution changed from 256
  mesh_padding: 0.1             # Padding around object bounds

  log_contact_every: 100

# ================================================================
# PHASE 5: TEMPORAL CONSISTENCY (500 steps = 0.25 epochs, FINAL ONLY)
# ================================================================
phase5:
  enabled: true

  # Minimal Phase 5 - last 500 steps only
  phase5_start_iter: 59500      # Start at epoch 29.75
  phase5_end_iter: 60000        # Explicit termination at training end

  # Scheduler configuration
  use_scheduler: true
  scheduler:
    total_iterations: 60000
    warmup_iters: 0
    phase3_start: 3000          # match phase3.phase3_start_iter (updated)
    phase4_start: 35000         # match contact_start_iter
    phase5_start: 59500         # match phase5_start_iter
    finetune_start: 59750       # 250 steps before end

  # Temporal weights - conservative
  w_temporal: 0.02              # was 0.01
  w_velocity: 0.005
  w_acceleration: 0.005
  w_camera_motion: 0.001

  # Memory optimizations - CRITICAL for OOM prevention
  adaptive_contacts:
    enabled: false              # Disabled to save ~125 MB
    k_neighbors: 5
    contact_threshold: 0.10
    update_frequency: 50
    cache_size: 50

  temporal:
    history_size: 3             # Reduced from 10 to minimum (saves 70% memory)
    velocity_weight: 1.0
    acceleration_weight: 0.5

  log_phase5_every: 100

# ================================================================
# SCENE & MODEL (UNCHANGED FROM STAGE 2)
# ================================================================
scene_bounding_sphere: 6.0

# ================================================================
# MODEL CONFIGURATION (MUST MATCH STAGE 2 CHECKPOINT)
# ================================================================
model:
  # Density configuration
  density:
    params_init:
      beta: 0.1
    beta_min: 0.0001

  # Ray sampler configuration
  ray_sampler:
    near: 0.0
    N_samples: 64
    N_samples_eval: 128
    N_samples_extra: 32
    eps: 0.1
    beta_iters: 10
    max_total_iters: 5
    N_samples_inverse_sphere: 32
    add_tiny: 0.000001

  # Object implicit network
  obj_implicit_network:
    feature_vector_size: 256
    d_in: 3
    d_out: 1
    dims: [256, 256, 256, 256, 256, 256, 256, 256]
    init: geometry
    bias: 0.6
    skip_in: [4]
    weight_norm: true
    multires: 6
    cond: geo
    cond_dim: 128
    use_film: True

  # Hand implicit network
  implicit_network:
    feature_vector_size: 256
    d_in: 3
    d_out: 1
    dims: [256, 256, 256, 256, 256, 256, 256, 256]
    init: geometry
    bias: 0.6
    skip_in: [4]
    weight_norm: true
    multires: 6
    cond: pose

  # Hand rendering network
  rendering_network:
    feature_vector_size: 256
    mode: pose
    d_in: 270
    d_out: 3
    dims: [256, 256, 256, 256]
    weight_norm: true
    multires_view: 0
    d_implicit_features: 256

  # Background implicit network
  bg_implicit_network:
    feature_vector_size: 256
    d_in: 4
    d_out: 1
    dims: [256, 256, 256, 256, 256, 256, 256, 256]
    init: none
    bias: 0.0
    skip_in: [4]
    weight_norm: false
    multires: 10
    cond: frame
    dim_frame_encoding: 32

  # Background rendering network
  bg_rendering_network:
    feature_vector_size: 256
    mode: nerf_frame_encoding
    d_in: 259
    d_out: 3
    dims: [128]
    weight_norm: false
    multires_view: 4
    dim_frame_encoding: 32
    multires_xyz: 42
    d_implicit_features: 171

# ================================================================
# DATASET CONFIGURATION (KEEP FROM STAGE 2)
# ================================================================
dataset:
  dataset_path: data/hold_MC1_ho3d/build
  seq_name: hold_MC1_ho3d

  train:
    type: train
    batch_size: 1
    drop_last: false
    shuffle: true
    num_workers: 4

  valid:
    type: val
    batch_size: 1
    drop_last: false
    shuffle: false
    pixel_per_batch: 512
    enabled: false

# ================================================================
# LOSS CONFIGURATION - 804b0572f Performance with 9fdbae668 Protection
# ================================================================
loss:
  # Geometry Controller (804b0572f levels for strong refinement)
  target_geom_share: 0.12        # was 0.07
  max_geom_scale: 6.0            # was 4.0
  geom_boost_factor: 1.2         # keep 804b0572f value

  # SDF Protection (keep from 9fdbae668 - prevents SDF death)
  w_sdf_reg: 0.5                 # was 1.0
  w_eikonal: 0.5                 # was 1.0
  w_sdf_on_verts: 0.3            # was 0.5

  # RGB Schedule
  w_rgb: 1.0
  w_rgb_schedule:
    enabled: true
    step_0: 0.5
    step_3000: 0.30              # give room to geometry + SDS
    step_8000: 0.50
    step_15000: 0.50             # was 0.3
    step_25000: 0.80
    step_30000: 1.0              # restore for final refinement
    step_35000: 1.0
    interpolation: "linear"

  w_mask: 0.5
  w_mask_edge: 0.15
  w_smooth: 0.1                  # was 0.5
  rgb_loss_type: "l1"

  # Self-supervised geometry
  w_normal_consistency: 0.5      # ↑ stronger normal smoothing; tune 0.3–1.0
  w_depth_smoothness: 0.1
  # Object compactness (anti-floater prior)
  w_obj_compactness: 0.1       # NEW: used in mesh-based regularization
  # Chamfer Settings (earlier start like 804b0572f)
  w_chamfer: 0.1                 # was 0.03
  chamfer_start_step: 1000       # was 4000

  # Object Template Chamfer (earlier start)
  w_obj_chamfer: 0.50           # was 0.15
  obj_chamfer_start_step: 1000  # was 1500
  w_obj_chamfer_decay:
    enabled: true               # Keep steady
    step_3000: 0.05             # ADD: cap at 3k
    step_8000: 0.02
    step_12000: 0.01
    step_16000: 0.005
    step_20000: 0.0

  w_obj_generic: 0.0
  w_obj_smoothness: 0.05         # was 0.0
  w_sdf_distill: 0.0             # was 0.1
  w_vertex_normal_prior: 0.5     # NEW: weight for vertex normal prior on v3d_cano
  w_residual_l2: 1.0e-4          # or 5.0e-5; keep it small

# ================================================================
# TRAINING CONFIGURATION - 30 EPOCHS
# ================================================================
training:
  num_epochs: 30
  max_steps: 60000
  eval_every_epoch: 999
  log_every: 50
  gradient_clip: 1.0
  mano_lr_multiplier: 0.1  # Explicitly set
  # Warm-up phase boundaries (in global_step units)
  geom_warmup_end: 0             # was 3500
  render_warmup_end: 1500
  joint_warmup_end: 3500         # ↑ from 3500 – more joint warm-up
  # Extended SDF-focused window
  sdf_warmup_end: 3500           # ↑ from 5000
  distill_start_step: 4000       # was 8000
  distill_min_grid_zeros: 2000   # was 5000
  object_freeze_at: 3000        # NEW: freeze object vertices after geometry is solid
  object_unfreeze_at: 10000     # NEW: allow refinement again after contact stabilizes

# ================================================================
# OPTIMIZER CONFIGURATION (STAGE 3 FINE-TUNE)
# ================================================================
optimizer:
  lr: 0.00005                    # was 0.000025 - restore 804b0572f LR
  type: "adam"
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Learning rate scheduler - cosine annealing
scheduler:
  type: "cosine"
  T_max: 60000                  # Full 30 epochs
  eta_min: 0.00001              # 10× reduction
  warmup_steps: 2000            # 1 epoch warmup

# ================================================================
# EXPERIMENT CONFIGURATION
# ================================================================
experiment:
  name: 'stage3_804b0572f_with_safety_rails'

# ================================================================
# CHECKPOINT
# ================================================================
checkpoint:
  # Load Stage 2 trained checkpoint
  resume_from: 'outputs/stage2_official_cb20a1702_FIXED/checkpoints/last.ckpt'
  load_optimizer: false
  load_scheduler: false

# ================================================================
# CALLBACKS - DUAL CHECKPOINT SYSTEM
# ================================================================
callbacks:
  # Epoch-based: Best model selection
  checkpoint:
    monitor: "train_loss"
    mode: "min"
    save_top_k: 3
    every_n_epochs: 5           # Save every 5 epochs (reduce frequency for 30 epochs)
    save_last: true
    dirpath: "checkpoints"
    filename: "epoch{epoch:02d}-loss{loss:.4f}"

  # Step-based checkpoint (saves every 500 steps)
  checkpoint_steps:
    monitor: null
    mode: "min"
    save_top_k: -1              # Save all step checkpoints
    every_n_train_steps: 500   # Save every steps for 30-epoch training
    save_last: false
    filename: "step{step:05d}"
    save_on_train_epoch_end: false
    verbose: true

logging:
  save_misc_every: 500