# ================================================================
# Stage 3: Pure SDS Training - 80K Steps (40 Epochs)
# Phase Distribution: Phase 3 only (SDS Diffusion)
# ================================================================

# ================================================================
# PHASE 3: SDS GUIDANCE ONLY (80,000 steps = 40 epochs)
# ================================================================
phase3:
  enabled: false

  # GHOP Checkpoints
  ghop:
    config_path: checkpoints/ghop/config.yaml
    device: cuda
    unet_checkpoint: /home/fredcui/Projects/ghop/output/joint_3dprior/mix_data/checkpoints/last.ckpt
    unified_checkpoint: /home/fredcui/Projects/ghop/output/joint_3dprior/mix_data/checkpoints/last.ckpt
    vqvae_checkpoint: /home/fredcui/Projects/ghop/output/joint_3dprior/mix_data/checkpoints/last.ckpt
    unet_use_pretrained: true
    vqvae_use_pretrained: true
    use_huggingface_clip: true
    clip_model_name: "openai/clip-vit-large-patch14"

  grid_resolution: 64
  spatial_lim: 1.5

  # Phase 3 spans entire training
  phase3_start_iter: 0
  phase3_end_iter: 34999         # ← CHANGED: Entire 80K training

  # SDS Configuration - Refined based on Session 60-62
  sds:
    diffusion_steps: 1000
    guidance_scale: 3.0
    max_step_ratio: 0.98
    min_step_ratio: 0.02
    noise_schedule: linear
    prediction_respacing: 50

  sds_iters: 1
  use_modular_init: true

  # Extended weight schedule for 80K steps
  w_sds_schedule:
    enabled: true
    step_0: 0.50                 # was 0.25
    step_5000: 0.45              # was 0.25
    step_10000: 0.40             # was 0.22
    step_15000: 0.35             # was 0.18
    step_20000: 0.30             # was 0.18
    step_25000: 0.25             # was 0.16
    step_30000: 0.20             # was 0.12
    step_34999: 0.2              # was 0.10
    interpolation: "linear"

  diagnostics:
    rgb_convergence_check:
      enabled: true
      step: 20000
      threshold: 0.08
      warning_only: true
    sds_trend_check:
      enabled: true
      check_every: 1000
      window: 2000
      max_increase: 0.2
    log_sds_weight_every: 100

  warmup_iters: 0

# ================================================================
# PHASE 4: CONTACT REFINEMENT (DISABLED)
# ================================================================
phase4:
  enabled: false                 # ← DISABLED: Contact loss stuck at 0.0

# ================================================================
# PHASE 5: TEMPORAL CONSISTENCY (DISABLED)
# ================================================================
phase5:
  enabled: false                 # ← DISABLED: Cannot skip Phase 4

# ================================================================
# SCENE & MODEL (UNCHANGED)
# ================================================================
scene_bounding_sphere: 6.0

model:
  density:
    params_init:
      beta: 0.1
    beta_min: 0.0001

  ray_sampler:
    near: 0.0
    N_samples: 64
    N_samples_eval: 128
    N_samples_extra: 32
    eps: 0.1
    beta_iters: 10
    max_total_iters: 5
    N_samples_inverse_sphere: 32
    add_tiny: 0.000001

  implicit_network:
    feature_vector_size: 256
    d_in: 3
    d_out: 1
    dims: [256, 256, 256, 256, 256, 256, 256, 256]
    init: geometry
    bias: 0.6
    skip_in: [4]
    weight_norm: true
    multires: 6
    cond: pose

  rendering_network:
    feature_vector_size: 256
    mode: pose
    d_in: 270
    d_out: 3
    dims: [256, 256, 256, 256]
    weight_norm: true
    multires_view: 0
    d_implicit_features: 256

  bg_implicit_network:
    feature_vector_size: 256
    d_in: 4
    d_out: 1
    dims: [256, 256, 256, 256, 256, 256, 256, 256]
    init: none
    bias: 0.0
    skip_in: [4]
    weight_norm: false
    multires: 10
    cond: frame
    dim_frame_encoding: 32

  bg_rendering_network:
    feature_vector_size: 256
    mode: nerf_frame_encoding
    d_in: 259
    d_out: 3
    dims: [128]
    weight_norm: false
    multires_view: 4
    dim_frame_encoding: 32
    multires_xyz: 42
    d_implicit_features: 171

# ================================================================
# DATASET CONFIGURATION
# ================================================================
dataset:
  dataset_path: data/hold_MC1_ho3d/build
  seq_name: hold_MC1_ho3d

  train:
    type: train
    batch_size: 1
    drop_last: false
    shuffle: true
    num_workers: 4

  valid:
    type: val
    batch_size: 1
    drop_last: false
    shuffle: false
    pixel_per_batch: 512
    enabled: false

  test:
    type: test
    batch_size: 1
    drop_last: false
    shuffle: false
    pixel_per_batch: 512

# ================================================================
# LOSS CONFIGURATION - Proven Working Losses Only
# ================================================================
loss:
  target_geom_share: 0.05       # try 0.05–0.10
  max_geom_scale: 5.0           # prevent runaway scaling
  geom_boost_factor: 1.5        # how fast the scale ramps
  w_sdf_reg: 1.0
  w_rgb: 1.0                   # was 0.8
  w_mask: 0.5              # CHANGED: from 0.1
  w_mask_edge: 0.15         # NEW: Add this line
  w_eikonal: 0.8                # Keep SDF regularization
  w_smooth: 0.01               # Keep smoothness
  w_temporal: 1.0               # NEW: Temporal base weight
  rgb_loss_type: "l1"
  # NEW: Self-supervised geometry
  w_normal_consistency: 0.2 # was 0.1, was effectively ~1e-2 from behavior
  w_depth_smoothness: 0.2 # was 0.1 increase until geometric_total is ~5–10% of total
  w_chamfer: 0.05                    # ← CHANGED from w_template_chamfer
  chamfer_start_step: 1000            # was 15000
  # ============================================================
  # Object Template Chamfer (temporarily disabled)
  # ============================================================
  w_obj_chamfer: 0.2          # was 0.1
  obj_chamfer_start_step: 100  # was disabled
  w_obj_generic: 0.0          # avoid extra priors while debugging, changed from 0.05
  w_obj_smoothness: 0.05       # was 0.02

# ================================================================
# TRAINING CONFIGURATION - 40 EPOCHS (80K steps)
# ================================================================
training:
  num_epochs: 30
  max_steps: 60000
  eval_every_epoch: 999
  log_every: 50
  gradient_clip: 1.0

# ================================================================
# OPTIMIZER CONFIGURATION
# ================================================================
optimizer:
  lr: 0.0001                    # Same learning rate as Stage 2
  type: "adam"
  weight_decay: 0.0
  betas: [0.9, 0.999]
  eps: 1.0e-08

# Learning rate scheduler - Cosine annealing over 80K
scheduler:
  type: "cosine"
  T_max: 60000                  # Full 30 epochs
  eta_min: 0.00001              # 10× reduction
  warmup_steps: 2000            # 1 epoch warmup

# ================================================================
# EXPERIMENT CONFIGURATION
# ================================================================
experiment:
  name: 'stage3_80k_sds_only_pure'

# ================================================================
# CHECKPOINT
# ================================================================
checkpoint:
  # Load Stage 2 trained checkpoint
  resume_from: 'outputs/stage2_official_cb20a1702_FIXED/checkpoints/last.ckpt'
  load_optimizer: false          # ← Fresh optimizer state
  load_scheduler: false          # ← Fresh scheduler state

# ================================================================
# CALLBACKS - CHECKPOINT SYSTEM
# ================================================================
callbacks:
  # Epoch-based: Best model selection
  checkpoint:
    monitor: "train_loss"
    mode: "min"
    save_top_k: 3
    every_n_epochs: 5           # Save every 5 epochs (reduce frequency for 30 epochs)
    save_last: true
    dirpath: "checkpoints"
    filename: "epoch{epoch:02d}-loss{loss:.4f}"

  # Step-based checkpoint - More granular
  checkpoint_steps:
    monitor: null
    mode: "min"
    save_top_k: -1              # Save all step checkpoints
    every_n_train_steps: 500   # Save every steps for 30-epoch training
    save_last: false
    filename: "step{step:05d}"
    save_on_train_epoch_end: false
    verbose: true
logging:
  save_misc_every: 500